[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "json-schema-diff"
version = "1.0.0"
description = "Production-grade CLI & library to detect breaking changes, added/removed fields, and constraint changes between JSON schemas."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "slopggobblercobbler81" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
json-schema-diff = "json_schema_diff.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
